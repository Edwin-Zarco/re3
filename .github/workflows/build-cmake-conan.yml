name: re3 conan+cmake
on:
  pull_request:
  push:
  release:
    types: published
jobs:
  build-cmake:
    strategy:
      matrix:
        include:
#          - os: 'windows-latest'
#            platform: 'gl3'
#            gl3_gfxlib: 'glfw'
#            audio: 'openal'
#          - os: 'windows-latest'
#            platform: 'gl3'
#            gl3_gfxlib: 'sdl2'
#            audio: 'openal'
#          - os: 'windows-latest'
#            platform: 'd3d9'
#            audio: 'openal'
#          - os: 'windows-latest'
#            platform: 'd3d9'
#            audio: 'miles'
#          - os: 'ubuntu-latest'
#            platform: 'gl3'
#            gl3_gfxlib: 'glfw'
#            audio: 'openal'
#          - os: 'ubuntu-latest'
#            platform: 'gl3'
#            gl3_gfxlib: 'sdl2'
#            audio: 'openal'
          - os: 'macos-latest'
            platform: 'gl3'
            gl3_gfxlib: 'glfw'
            audio: 'openal'
#          - os: 'macos-latest'
#            platform: 'gl3'
#            gl3_gfxlib: 'sdl2'
#            audio: 'openal'
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.platform == 'ps2' || matrix.gl3_gfxlib == 'sdl2' || matrix.audio == 'miles' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: "Checkout Miles SDK Import Library project"
        uses: actions/checkout@v7
        if: ${{ matrix.audio == 'miles' }}
        with:
          repository: 'withmorten/re3mss'
          path: 're3mss'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      # macos-latest now points at the macOS 26 (Tahoe) image, which only ships
      # Xcode 26.x builds (Xcode 16 is no longer present at all) - the old pin
      # to work around missing conan-center-index binaries for a brand-new
      # Xcode doesn't apply anymore. Using whatever the image defaults to.
      # If conan-center-index ever falls behind the image's default Xcode
      # again, list installed versions with `ls /Applications | grep Xcode`
      # in a debug step and pin explicitly with xcode-select.
      - name: "Setup conan"
        run: |
          python -m pip install --upgrade pip
          python -m pip install conan
          conan --version
          conan profile detect --force
      - name: "Add os=playstation2 + gcc.version=3.2 to Conan 2 settings"
        shell: python
        run: |
          import os, yaml
          settings_path = os.path.expanduser("~/.conan2/settings.yml")
          yml = yaml.safe_load(open(settings_path))
          yml["os"]["playstation2"] = None
          yml["compiler"]["gcc"]["version"].append("3.2")
          yml["compiler"]["gcc"]["version"].sort()
          yaml.safe_dump(yml, open(settings_path, "w"))
      - name: "Create host profile"
        shell: bash
        run: |
          if test "${{ matrix.platform }}" = "ps2"; then
            cp vendor/librw/conan/playstation2 host_profile
          else
            cp ~/.conan2/profiles/default host_profile
          fi
      - name: "Export Playstation 2 CMake toolchain conan recipe"
        # This recipe is still Conan-1-only (`from conans import ConanFile`)
        # and hasn't been migrated - gated out until either it's migrated or
        # `ps2` is actually enabled in the matrix above.
        if: ${{ matrix.platform == 'ps2' }}
        run: |
          conan export vendor/librw/cmake/ps2/cmaketoolchain --name=ps2dev-cmaketoolchain --version=master
      - name: "Export librw conan recipe"
        run: |
          conan export vendor/librw --name=librw --version=master
      - name: "Export Miles SDK conan recipe"
        if: ${{ matrix.audio == 'miles' }}
        run: |
          conan export re3mss --name=miles-sdk --version=master
      - name: "Download/build dependencies (conan install)"
        run: |
          conan install . \
            --output-folder=build \
            --build=missing \
            -o "&:audio=${{ matrix.audio }}" \
            -o "librw/*:platform=${{ matrix.platform }}" \
            -o "librw/*:gl3_gfxlib=${{ matrix.gl3_gfxlib || 'glfw' }}" \
            -pr:h=host_profile -pr:b=default \
            -s "&:build_type=RelWithDebInfo" \
            -s "librw/*:build_type=RelWithDebInfo"
        env:
          CONAN_SYSREQUIRES_MODE: enabled
      - name: "Configure (cmake)"
        working-directory: ./build
        run: |
          cmake .. -DCMAKE_TOOLCHAIN_FILE=generators/conan_toolchain.cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: "Build (cmake)"
        working-directory: ./build
        run: |
          cmake --build . --config RelWithDebInfo
      - name: "Package (cmake install)"
        working-directory: ./build
        run: |
          cmake --install . --prefix ../package --config RelWithDebInfo
      - name: "Create binary package (cpack)"
        working-directory: ./build
        run: |
          cpack -C RelWithDebInfo
      - name: "Archive binary package (github artifacts)"
        uses: actions/upload-artifact@v7
        with:
          name: "${{ matrix.os }}-${{ matrix.platform }}"
          path: build/*.zip
          if-no-files-found: error
